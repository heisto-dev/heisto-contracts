name: Test reproducible verifier image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out verification tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: tooling
      - name: Check out exact public source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 358de359889de10843745d4124114a7db54b54cd
          persist-credentials: false
          path: source
      - name: Build a pinned verification image
        run: docker build -f tooling/verification/Dockerfile -t heisto-verify-cargo188:local tooling/verification
      - name: Install checksum-pinned official verifier
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.5.2/solana-verify-0.5.2-linux \
            --output "$RUNNER_TEMP/solana-verify"
          echo "b9d5ccce9634dc14269cab3e7a58649bc141b3306e7735a94478c936341f211f  $RUNNER_TEMP/solana-verify" | sha256sum --check
          chmod +x "$RUNNER_TEMP/solana-verify"
      - name: Rebuild via the public verifier CLI
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/solana-verify" build \
            --base-image heisto-verify-cargo188:local \
            --arch v3 \
            --cargo-build-sbf-args="--no-rustup-override --tools-version v1.57 --optimize-size"
          git diff --exit-code -- Cargo.toml Cargo.lock programs/heisto
      - name: Compare with Mainnet evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/scripts/compare-build.py \
            source/target/deploy/heisto.so \
            tooling/evidence/source-verification-recheck.json \
            358de359889de10843745d4124114a7db54b54cd \
            "$RUNNER_TEMP/source-comparison.json"
      - name: Preserve source build proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-image-proof
          path: |
            ${{ runner.temp }}/source-comparison.json
            source/target/deploy/heisto.so
          if-no-files-found: warn
          retention-days: 30
